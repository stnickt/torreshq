services:
  brandon-site:
    build: .
    container_name: brandon-torreshq
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: brandon-torreshq-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
